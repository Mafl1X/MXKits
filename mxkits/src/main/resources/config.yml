database:
  type: sqlite # mysql or sqlite
  host: 127.0.0.1
  port: 3306
  database: mxkits
  user: root
  password: password
  pool-size: 10
  connection-timeout: 30000

messages:
  help: |-
    &6MXKits commands:
    &e/mxkit preview <kit> &7- preview a kit
    &e/mxkit create <kit> &7- create a kit from your inventory
    &e/mxkit editkit <kit> &7- edit a kit
    &e/mxkit give <player> <kit> &7- give kit to player
  successfullyPreviewOpen: '&aSuccessfully opened kit preview!'
  kitCreated: '&aKit created from your inventory!'
  kitAlreadyExists: '&cKit with this name already exists!'
  kitNotCreated: '&cKit was not created!'
  kitNotFound: '&cKit not found!'
  successfullyTakeItKit: '&aSuccessfully received the kit!'
  hasCooldown: '&cCooldown: %cooldown!'
  pointsNotFound: '&cYou do not have enough points!'
  successfullyBuyKit: '&aYou have successfully purchased the kit!'
  noHavePermissionTakeItKits: '&cYou do not have permission to take this kit!'

kitDefaults:
  delay: 0
  points: 0
  groups: ''

